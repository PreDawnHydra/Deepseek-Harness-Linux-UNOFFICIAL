name: build
# Builds AppImage/deb/rpm for x64 and arm64. With release=true it also publishes a GitHub Release
# that installed apps pick up through their built-in updater.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release from this build
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        description: Commit to build
        type: string
        default: ''

permissions:
  contents: write

env:
  # Installed apps poll this feed; GitHub serves the newest non-prerelease release here.
  UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: ./scripts/fetch-upstream.sh
      - run: ./scripts/apply-patches.sh
      - run: ./scripts/build.sh --all
        env:
          DSH_DESKTOP_LINUX_MAINTAINER: "PreDawnHydra <83977114+PreDawnHydra@users.noreply.github.com>"
          DSH_DESKTOP_LINUX_UPDATE_URL: ${{ env.UPDATE_URL }}
      - name: Collect artifacts
        run: |
          out=upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts
          mkdir dist
          cp "$out"/*.AppImage "$out"/*.deb "$out"/*.rpm "$out"/*.yml dist/
          cp "$out"/*.blockmap dist/ 2>/dev/null || true
          rm -f dist/builder-debug.yml dist/builder-effective-config.yaml
          ls -la dist
          # The updater fails closed without its feed file, so a build without one is a broken release.
          ls dist/nightly-linux*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: ${{ inputs.release }}
    needs: linux
    runs-on: ubuntu-24.04
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source upstream.env
          version="${UPSTREAM_TAG#dsh-v}"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to publish"
            exit 0
          fi
          notes="Unofficial Linux build of DeepSeek Harness Desktop $version, built from upstream [\`$UPSTREAM_TAG\`](https://github.com/deepseek-ai/deepseek-harness/releases/tag/$UPSTREAM_TAG) (\`${UPSTREAM_COMMIT:0:12}\`).

          Installed copies update themselves from here. First install: AppImage (\`chmod +x\` and run), \`sudo apt install ./*.deb\`, or \`sudo dnf install ./*.rpm\`."
          # Not marked as a prerelease even for upstream rc tags: releases/latest/download only serves
          # full releases, and that URL is the feed every installed copy polls.
          gh release create "$tag" dist/* --title "DeepSeek Harness $version for Linux" --notes "$notes" --latest --target "$(git rev-parse HEAD)"
