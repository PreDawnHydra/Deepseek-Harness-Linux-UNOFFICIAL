name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: ./scripts/fetch-upstream.sh
      - run: ./scripts/apply-patches.sh
      - run: ./scripts/build.sh --all
        env:
          DSH_DESKTOP_LINUX_MAINTAINER: "PreDawnHydra <83977114+PreDawnHydra@users.noreply.github.com>"
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-${{ matrix.arch }}
          path: |
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.deb
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.rpm
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.deb
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.rpm
